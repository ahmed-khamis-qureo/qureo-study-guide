let data,term='',pageN=0;const app=document.querySelector('#app'),ar=n=>Number(n).toLocaleString('ar-EG'),esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let store={saved:[],last:null};try{store=JSON.parse(localStorage.getItem('qureo79')||'null')||store}catch{}const persist=()=>{try{localStorage.setItem('qureo79',JSON.stringify(store))}catch{}};function route(){let m=location.hash.match(/^#\/(python|javascript)(?:\/c\/(\d+))?(?:\/l\/(\d+))?(?:\/q\/(\d+))?/);return m?{course:m[1],c:+m[2]||0,l:+m[3]||0,q:+m[4]||0}:{course:'python',c:0,l:0,q:0}}function go(s){location.hash=s;scrollTo(0,0)}function key(r){return `${r.course}/${r.c}/${r.l}/${r.q}`}function topbar(title,sub,back){return `<div class="topbar"><button data-go="${back}">‹ رجوع</button><div class="title"><h2>${esc(title)}</h2><div class="muted">${esc(sub)}</div></div><button data-go="/${route().course}">الفصول</button></div>`}const footer=`<div class="foot">إعداد وتصميم أحمد بن خميس. مرجع تعليمي مستقل غير تابع لـQUREO. طابق نص السؤال قبل النسخ، ترتيب الأسئلة والاختيارات ممكن يختلف. لا يوجد تسجيل دخول أو حل آلي في هذا الموقع.</div>`;function render(){if(!data)return;const r=route(),list=data[r.course],c=list.find(x=>x.n===r.c),lang=r.course==='python'?'Python':'JavaScript';let out='';if(!r.c){const filtered=list.filter(x=>!term||JSON.stringify(x).toLowerCase().includes(term));const pages=Math.ceil(filtered.length/6);pageN=Math.min(pageN,Math.max(0,pages-1));const group=filtered.slice(pageN*6,pageN*6+6);out=`<div class="intro"><h1>حلول كيريو</h1><p class="byline">JavaScript وPython · إعداد وتصميم أحمد بن خميس</p><p class="muted">${ar(Object.values(data).flat().filter(c=>c.ready).length)} فصل متاح من ٧٩ · الإضافة مستمرة</p></div><div class="courses"><button class="${r.course==='javascript'?'active':''}" data-go="/javascript">JavaScript · ٥٤ فصل</button><button class="${r.course==='python'?'active':''}" data-go="/python">Python · ٢٥ فصل</button></div><l
