let data,term='',pageN=0;const app=document.querySelector('#app'),ar=n=>Number(n).toLocaleString('ar-EG'),esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let store={saved:[],last:null};try{store=JSON.parse(localStorage.getItem('qureo79')||'null')||store}catch{}const persist=()=>{try{localStorage.setItem('qureo79',JSON.stringify(store))}catch{}};function route(){let m=location.hash.match(/^#\/(python|javascript)(?:\/c\/(\d+))?(?:\/l\/(\d+))?(?:\/q\/(\d+))?/);return m?{course:m[1],c:+m[2]||0,l:+m[3]||0,q:+m[4]||0}:{course:'python',c:0,l:0,q:0}}function go(s){location.hash=s;scrollTo(0,0)}function key(r){return `${r.course}/${r.c}/${r.l}/${r.q}`}function topbar(title,sub,back){return `<div class="topbar"><button data-go="${back}">‹ رجوع</button><div class="title"><h2>${esc(title)}</h2><div class="muted">${esc(sub)}</div></div><button data-go="/${route().course}">الفصول</button></div>`}const footer=`<div class="foot">إعداد وتصميم أحمد بن خميس. مرجع تعليمي مستقل غير تابع لـQUREO. طابق نص السؤال قبل النسخ، ترتيب الأسئلة والاختيارات ممكن يختلف. لا يوجد تسجيل دخول أو حل آلي في هذا الموقع.</div>`;function render(){if(!data)return;const r=route(),list=data[r.course],c=list.find(x=>x.n===r.c),lang=r.course==='python'?'Python':'JavaScript';let out='';if(!r.c){const filtered=list.filter(x=>!term||JSON.stringify(x).toLowerCase().includes(term));const pages=Math.ceil(filtered.length/6);pageN=Math.min(pageN,Math.max(0,pages-1));const group=filtered.slice(pageN*6,pageN*6+6);out=`<div class="intro"><h1>حلول كيريو</h1><p class="byline">JavaScript وPython · إعداد وتصميم أحمد بن خميس</p><p class="muted">${ar(Object.values(data).flat().filter(c=>c.ready).length)} فصل متاح من ٧٩ · الإضافة مستمرة</p></div><div class="courses"><button class="${r.course==='javascript'?'active':''}" data-go="/javascript">JavaScript · ٥٤ فصل</button><button class="${r.course==='python'?'active':''}" data-go="/python">Python · ٢٥ فصل</button></div><label class="muted" for="search">اكتب رقم الفصل أو اسم الموضوع أو السؤال</label><div class="searchrow"><input id="search" value="${esc(term)}" placeholder="مثال: ١٢، المتغيرات، for" type="search"><button id="saved">المحفوظات</button></div><div class="ranges">${Array.from({length:Math.ceil(list.length/6)},(_,i)=>`<button class="${i===pageN?'active':''}" data-page="${i}">${i*6+1}–${Math.min(list.length,i*6+6)}</button>`).join('')}</div><div class="grid">${group.map(c=>`<button class="tile ${c.ready?'':'pending'}" data-go="/${r.course}/c/${c.n}"><strong>${ar(c.n)}</strong><b>${esc(c.title)}</b><small>${c.ready?`${ar(c.lessons.length-1)} دروس · متاح ✓`:'قيد الإضافة'}</small></button>`).join('')}</div><div class="pager"><button data-page="${pageN-1}" ${pageN===0?'disabled':''}>السابق</button><span>${filtered.length?ar(pageN*6+1)+'–'+ar(Math.min(filtered.length,pageN*6+6)):0} من ${ar(filtered.length)}</span><button data-page="${pageN+1}" ${pageN>=pages-1?'disabled':''}>التالي</button></div>${store.last?`<button class="resume" data-go="/${store.last}"><b>كمّل من آخر سؤال</b><div class="muted">${esc(store.last.split('/')[0])} · الفصل ${ar(store.last.split('/')[1])}</div></button>`:''}${footer}`;}else if(!c){out=topbar('الفصل غير موجود','',`/${r.course}`)}else if(!c.ready){out=topbar(`الفصل ${ar(c.n)}: ${c.title}`,lang,`/${r.course}`)+`<div class="question"><b>الفصل ده لسه بيتجهّز</b><p>هنضيف الأسئلة والإجابات بعد مراجعتها، على نفس الرابط.</p></div>`}else if(!r.l){out=topbar(`الفصل ${ar(c.n)}: ${c.title}`,`${lang} · ${ar(c.lessons.length-1)} دروس`, `/${r.course}`)+`<div class="list">${c.lessons.map(l=>`<button data-go="/${r.course}/c/${c.n}/l/${l.n}"><span><b>${l.n===c.lessons.length?'مراجعة الفصل':`الدرس ${ar(l.n)}: ${esc(l.title)}`}</b><small>${ar(l.exercises.length)} سؤال ونشاط</small></span><span class="arrow">‹</span></button>`).join('')}</div>`;}else{const l=c.lessons.find(x=>x.n===r.l);if(!l){go(`/${r.course}/c/${c.n}`);return}if(!r.q){out=topbar(`الدرس ${ar(l.n)}: ${l.title}`,`الفصل ${ar(c.n)}: ${c.title}`,`/${r.course}/c/${c.n}`)+`<div class="list">${l.exercises.map((e,i)=>`<button data-go="/${r.course}/c/${c.n}/l/${l.n}/q/${i+1}"><span><b>${e.kind==='dialogue'?'سؤال داخل الدرس':'السؤال'} ${ar(i+1)}</b><small>${e.kind==='code'?'كتابة كود':e.kind==='dialogue'?'اختيارات وتعقيب المنصة':e.codes.length?'كتابة كود':'اختيار الإجابة'}</small></span><span class="arrow">‹</span></button>`).join('')||'<div class="question">درس مفاهيم بدون أسئلة.</div>'}</div><a class="source" href="${esc(l.url)}" target="_blank" rel="noopener">افتح الدرس على كيريو ↗</a>`}else{const e=l.exercises[r.q-1];if(!e){go(`/${r.course}/c/${c.n}/l/${l.n}`);return}store.last=key(r);persist();out=topbar(`السؤال ${ar(r.q)} من ${ar(l.exercises.length)}`,`${lang} · الفصل ${ar(c.n)} · ${l.title}`,`/${r.course}/c/${c.n}/l/${l.n}`)+`<div class="progress"><div style="width:${r.q/l.exercises.length*100}%"></div></div><div class="question"><div class="label">المطلوب</div><p>${esc(e.prompt)}</p>${e.image?`<img src="${esc(e.image)}" alt="${esc(e.imageAlt)}">`:''}${(e.contextCodes||[]).map(v=>`<pre class="code">${esc(v.code)}</pre>`).join('')}${e.choices?`<ul>${e.choices.map(v=>`<li>${esc(v)}</li>`).join('')}</ul>`:''}</div>${e.answer?`<div class="answerbar"><span class="label">الإجابة الصحيحة</span></div><div class="answer">${esc(e.answer)}</div>`:''}${e.codes.map((v,i)=>`<div class="answerbar"><span class="label">الحل · ${esc(v.lang)}</span><button class="green" data-copy="${i}">انسخ الحل</button></div><pre class="code"><code>${esc(v.code)}</code></pre>`).join('')}${e.responses?`<details><summary>ردود المنصة على الاختيارات</summary>${e.responses.map(v=>`<p><b>${esc(v.label)}</b><br>${esc(v.response)}</p>`).join('')}</details>`:''}${e.followup?`<details><summary>تعقيب المنصة بعد السؤال</summary><p>${esc(e.followup)}</p></details>`:''}${e.note?`<p class="muted">${esc(e.note)}</p>`:''}<div class="tools"><button id="save">${store.saved.includes(key(r))?'★ محفوظ':'☆ احفظ للمراجعة'}</button><button id="share">انسخ رابط السؤال</button></div><div class="pager"><button data-go="/${r.course}/c/${c.n}/l/${l.n}/q/${r.q-1}" ${r.q===1?'disabled':''}>السابق</button><span>${ar(r.q)} / ${ar(l.exercises.length)}</span><button data-go="/${r.course}/c/${c.n}/l/${l.n}/q/${r.q+1}" ${r.q===l.exercises.length?'disabled':''}>التالي</button></div><a class="source" href="${esc(l.url)}" target="_blank" rel="noopener">مصدر الدرس على كيريو ↗</a>`;}}app.innerHTML=out;}
document.addEventListener('click',async ev=>{const b=ev.target.closest('button');if(!b||b.disabled)return;if(b.dataset.go){term='';pageN=0;go(b.dataset.go)}if(b.dataset.page!==undefined){pageN=+b.dataset.page;render()}const r=route();if(b.dataset.copy!==undefined){let e=data[r.course].find(x=>x.n===r.c).lessons.find(x=>x.n===r.l).exercises[r.q-1];try{await navigator.clipboard.writeText(e.codes[+b.dataset.copy].code);b.textContent='تم النسخ ✓'}catch{b.textContent='حدد الكود وانسخه'}}if(b.id==='save'){const k=key(r);store.saved=store.saved.includes(k)?store.saved.filter(x=>x!==k):[...store.saved,k];persist();render()}if(b.id==='share'){try{await navigator.clipboard.writeText(location.href);b.textContent='تم نسخ الرابط ✓'}catch{}}if(b.id==='saved'){app.innerHTML=topbar('المحفوظات','محفوظة على جهازك',`/${r.course}`)+`<div class="list">${store.saved.map(k=>{let [co,c,l,q]=k.split('/');return `<button data-go="/${co}/c/${c}/l/${l}/q/${q}">${co} · الفصل ${ar(c)} · السؤال ${ar(q)} <span>‹</span></button>`}).join('')||'<p class="muted">لا توجد أسئلة محفوظة بعد.</p>'}</div>`}});document.addEventListener('input',e=>{if(e.target.id==='search'){const start=e.target.selectionStart;term=e.target.value.toLowerCase().trim();pageN=0;render();const s=document.querySelector('#search');s.focus();s.setSelectionRange?.(start,start)}});window.addEventListener('hashchange',()=>{render();scrollTo(0,0)});fetch('data:application/gzip;base64,'+window.QDATA1+window.QDATA2).then(r=>r.blob()).then(b=>new Response(b.stream().pipeThrough(new DecompressionStream('gzip'))).json()).then(x=>{data=x;render()}).catch(()=>{app.innerHTML='<p>تعذر تحميل الإجابات. أعد فتح الصفحة.</p>'});
